[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "videotranslatorai"
dynamic = ["version"]
description = "Local AI video dubbing and translation tool with GUI and CLI workflows."
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = { file = "LICENSE" }
authors = [
  { name = "VideoTranslatorAI contributors" }
]
keywords = [
  "video-translation",
  "dubbing",
  "whisper",
  "tts",
  "ollama",
  "wav2lip",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Environment :: Win32 (MS Windows)",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Multimedia :: Sound/Audio :: Speech",
  "Topic :: Multimedia :: Video",
]
dependencies = [
  "faster-whisper",
  # PyAV 19 dropped av.open(metadata_errors=...), used by faster-whisper 1.2.1.
  "av<19",
  "yt-dlp",
  "demucs",
  "soundfile",
  "edge-tts>=7.3.1",
  "deep-translator",
  "requests",
  "pydub",
  "pyloudnorm",
  "torchcodec",
  "numpy>=2.0,<2.4",
  "audioop-lts; python_version >= '3.13'",
]

[project.optional-dependencies]
optional = [
  "coqui-tts>=0.27.5",
  "transformers>=4.40.0,<5.1",
  "sentencepiece>=0.2.0",
  "sacremoses>=0.1.1",
  "pyannote.audio>=3.1,<4.0",
  "silero-vad",
  "keyring",
]
wav2lip = [
  "dlib",
  "facexlib",
  "new-basicsr",
]
player = [
  "mpv>=1.0.6,<2",
]
gpu-cu124 = [
  "torch>=2.6.0,<2.8",
  "torchaudio==2.6.0",
  "torchvision==0.21.0",
]
dev = [
  "opencv-python-headless",
  "numpy>=2.0,<2.4",
  "soundfile",
]

[project.scripts]
videotranslatorai = "videotranslator.cli:main"
videotranslator-ai = "videotranslator.cli:main"
video-translator-ai = "videotranslator.cli:main"

[project.gui-scripts]
videotranslatorai-gui = "videotranslator.cli:main"
videotranslator-ai-gui = "videotranslator.cli:main"

[project.urls]
Homepage = "https://github.com/HeartB1t/VideoTranslatorAI"
Repository = "https://github.com/HeartB1t/VideoTranslatorAI"
Issues = "https://github.com/HeartB1t/VideoTranslatorAI/issues"

[tool.setuptools]
py-modules = ["video_translator_gui"]
include-package-data = true
# The icons and fonts stay in assets/ in the repository (release ZIP, Windows
# installer); the wheel carries them inside the package as
# videotranslator/assets, found by videotranslator.resource_paths. The list
# is explicit because of that mapping: add new subpackages here.
packages = ["videotranslator", "videotranslator.assets", "videotranslator.assets.fonts"]
package-dir = { "videotranslator.assets" = "assets" }

[tool.setuptools.package-data]
"videotranslator.assets" = ["icon.ico", "icon.png", "icon_256.png"]
"videotranslator.assets.fonts" = ["*.ttf", "OFL-*.txt"]

[tool.setuptools.exclude-package-data]
"videotranslator.assets" = ["screenshot.png"]

[tool.setuptools.dynamic]
version = { attr = "videotranslator.__version__" }

# ---------------------------------------------------------------------------
# Ruff: gate di qualita' della CI. Primo giro volutamente PERMISSIVO: una
# baseline VERDE che blocca le nuove violazioni ad alto valore (sintassi,
# nomi non definiti in codice reale, mutable default, confronti errati,
# ecc.), non una pulizia di massa del codice legacy. Le categorie stilistiche
# o i falsi positivi gia' presenti sono in ignore e potranno essere stretti
# in una fase di qualita' dedicata, file per file.
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py310"
# Gli asset/i binari e i profili non contengono sorgente da lintare.
extend-exclude = ["assets", "docs"]

[tool.ruff.lint]
# E4 import, E7 statement, E9 sintassi, F pyflakes, B flake8-bugbear.
select = ["E4", "E7", "E9", "F", "B"]
ignore = [
  "E402",  # import non in cima: voluto dopo sys.path.insert e apply_startup_env
  "E702",  # piu' statement con ; : blocco palette globals() in video_translator_gui
  "E731",  # lambda assegnata: usate come callback brevi
  "F401",  # import inutilizzato: il monolite RI-ESPORTA di proposito dal pacchetto
  "F821",  # nome non definito: falsi positivi su closure e annotazioni differite
  "F841",  # variabile locale non usata
  "B008",  # chiamata nei default: FastAPI-style non in uso qui, evita rumore
  "B018",  # espressione inutile: asserzioni di accesso nei test (es. _Host().x)
  "B023",  # loop var nella closure: pattern di test (side_effect chiamato subito)
  "B033",  # valori duplicati in set: liste di parole in whisper_sanity, innocue
  "B904",  # raise senza from: catene d'errore nei test
  "B905",  # zip senza strict: compat Python 3.10 (strict e' 3.10+, molti siti)
]
