name: tests

on:
  push:
    branches: [main]
    paths:
      - "videotranslator/**"
      - "tests/**"
      - "video_translator_gui.py"
      - "setup_windows.bat"
      - "requirements*.txt"
      - "pyproject.toml"
      - "MANIFEST.in"
      - "assets/**"
      - "README.md"
      - "docs/i18n/**"
      - ".github/workflows/tests.yml"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    name: unit-tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install lightweight test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Compile every Python file
        run: |
          python -m py_compile video_translator_gui.py
          python -m py_compile videotranslator/*.py

      - name: Validate package metadata
        run: |
          python -m pip install --dry-run --no-build-isolation --no-deps -e .

      - name: Run unit tests
        run: |
          python -m unittest discover -s tests -v

  # The Tk tests skip without a display: here they run on Xvfb, together with
  # the real libmpv smoke test (a generated, silent clip). The heavy AI
  # smoke tests stay opt-in, and no test calls a paid service.
  gui-tests:
    name: gui-tests (Linux, Xvfb, libmpv, Python 3.13)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install Xvfb, libmpv and ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb xauth libmpv2 ffmpeg

      - name: Install test dependencies and the player binding
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt -r requirements-player.txt

      - name: Run every test on a virtual display
        env:
          VTAI_PLAYER_REAL: "1"
        run: |
          xvfb-run -a python -m unittest discover -s tests -v

  # Python 3.11 is what setup_windows.bat installs.
  windows-tests:
    name: windows-tests (Python 3.11)
    runs-on: windows-latest
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install lightweight test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # The runner's desktop is 1024x768 and Windows keeps a window within the
      # screen: the layout tests need a 1100x780 window.
      - name: Use a 1920x1080 desktop
        shell: pwsh
        run: Set-DisplayResolution -Width 1920 -Height 1080 -Force

      - name: Compile every Python file
        run: |
          python -m py_compile video_translator_gui.py
          for file in videotranslator/*.py; do python -m py_compile "$file"; done

      - name: Run unit tests
        run: |
          python -m unittest discover -s tests -v
